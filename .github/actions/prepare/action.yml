name: Prepare Node, npm and optional Pi host
description: Shared runtime preparation for CI and single-package publishing
inputs:
  node-version:
    description: Node major version
    default: '24'
  pi-host:
    description: Install the pinned Pi test host
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org
    # OIDC requires npm >= 11.5.1; keep all workflow environments aligned.
    - name: Prepare npm
      shell: bash
      run: npm install --global npm@11.5.1
    - name: Prepare Pi test host
      if: inputs.pi-host == 'true'
      shell: bash
      run: npm install --global @earendil-works/pi-coding-agent@0.87.1
