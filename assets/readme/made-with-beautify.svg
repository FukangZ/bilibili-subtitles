    <rect x="2" y="8" width="32" height="25" rx="7" fill="#FB7299"/>
    <rect x="8" y="14" width="9" height="3" rx="1.5" fill="#FFFFFF"/>
    <rect x="19" y="14" width="9" height="3" rx="1.5" fill="#FFFFFF"/>
    <rect x="8" y="21" width="20" height="3" rx="1.5" fill="#FFFFFF"/>
  </g>

  <g id="signature-copy" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
